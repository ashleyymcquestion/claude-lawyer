[project]
name = "paralegal"
version = "0.1.0"
description = "A team of AI agents that works like a paralegal for California landlord-tenant and small business matters"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.1"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
paralegal = "paralegal.cli:main"

[tool.setuptools]
packages = ["paralegal"]
